<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Extra 1 — Options</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <h1>YouTube Extra 1</h1>
    <p class="subtitle">Move, rotate &amp; zoom controls for YouTube</p>

    <form id="options-form">
      <fieldset>
        <legend>Video Transform Defaults</legend>

        <div class="field">
          <label for="opt-scale">Scale (Zoom)</label>
          <input type="range" id="opt-scale" min="0.1" max="3" step="0.01" value="1">
          <span class="value" id="opt-scale-val">1.00</span>
        </div>

        <div class="field">
          <label for="opt-rotate">Rotation (°)</label>
          <input type="range" id="opt-rotate" min="-360" max="360" step="30" value="0">
          <span class="value" id="opt-rotate-val">0°</span>
        </div>

        <div class="field">
          <label for="opt-top">Vertical Offset (px)</label>
          <input type="number" id="opt-top" min="-500" max="500" step="10" value="0">
        </div>

        <div class="field">
          <label for="opt-left">Horizontal Offset (px)</label>
          <input type="number" id="opt-left" min="-500" max="500" step="10" value="0">
        </div>
      </fieldset>

      <fieldset>
        <legend>Behavior</legend>

        <div class="field checkbox">
          <input type="checkbox" id="opt-keep" checked>
          <label for="opt-keep">Keep values across page navigations</label>
        </div>

        <div class="field checkbox">
          <input type="checkbox" id="opt-hide-ui">
          <label for="opt-hide-ui">Hide YouTube UI elements (autonav, theater, subtitles, etc.)</label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" id="btn-reset" class="btn-secondary">Reset to Defaults</button>
      </div>

      <div id="status" class="status" hidden>Settings saved.</div>
    </form>
  </div>

  <script src="dist/options.bundle.js"></script>
</body>

</html>
